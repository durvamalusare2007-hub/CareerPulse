<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareerPulse AI - Personalized Career & Employment Advisor</title>
  
  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark: '#2A2A2A',
              bg: '#F9F5ED',
              primary: '#5E83AE',
              'primary-dark': '#47688F',
              'primary-light': '#7E9EB8',
              surface: '#FFFFFF',
              cream: '#F3EFE6',
              border: '#E8E2D5',
            },
            status: {
              emerald: '#2E7D32',
              amber: '#D97706',
              red: '#DC2626'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React 18 & Babel Standalone for Seamless SPA Execution -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="bg-[#F9F5ED] text-[#2A2A2A] min-h-screen antialiased selection:bg-[#5E83AE] selection:text-white">
  <div id="root"></div>

  <!-- React App Application Script -->
  <script type="text/babel" src="/static/app.js"></script>
</body>
</html>
